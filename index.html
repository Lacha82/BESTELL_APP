<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerHouse</title>
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./script.js"></script>
</head>

<body onload="init()">
    <header class="header">
        <div class="header-content">
            <span class="logo">BurgerHouse</span>
            <div class="burger-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="restaurant">
            <!-- Platzhalter: Bild aus Figma exportieren (unter 500 KB) und hier einsetzen -->
            <div class="hero-image"></div>
            <div class="restaurant-logo">🍔</div>
            <div class="restaurant-title">
                <h1 class="restaurant-name"><span class="text-orange">Burger</span>House</h1>
                <span class="rating">★ 4,1</span>
            </div>
            <p class="restaurant-description">The best of Burgers, Pizza, and Greens, all in one great place.</p>
            <p class="restaurant-delivery">Delivery fee 4,99 €</p>
        </section>

        <div class="content-wrapper">
            <section id="dishes" class="dishes"></section>

            <aside class="basket-wrapper">
                <div class="basket">
                    <h2 class="basket-title">Your Basket</h2>
                    <div id="basketItems" class="basket-items">
                        <p class="basket-empty">Nothing here yet.<br>Go ahead and choose something delicious!</p>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="footer">
    </footer>
</body>

</html>
